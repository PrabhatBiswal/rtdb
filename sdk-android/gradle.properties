org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# The dev gateway the :demo talks to. 10.0.2.2 is the host machine as seen from the emulator.
# Override per invocation: ./gradlew :demo:installDebug -PrtdbUrl=ws://10.0.2.2:8787
rtdbUrl=ws://10.0.2.2:8787
# A PRE-MINTED token for a real endpoint, empty by default. Never put the production HS256
# SECRET in an APK: a leaked token is a revocable kick (§10), a leaked secret is a rotation of
# every token ever issued.
# Override: ./gradlew :demo:assembleDebug -PrtdbUrl=wss://... -PrtdbToken=eyJ...
rtdbToken=
