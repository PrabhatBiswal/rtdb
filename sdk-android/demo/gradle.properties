org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# The gateway the demo talks to. 10.0.2.2 is the host machine as seen from an emulator; the Gate C
# proof overrides it to the production endpoint.
# Override per invocation: ./gradlew installDebug -PrtdbUrl=wss://rtdb.example.com -PrtdbToken=eyJ...
rtdbUrl=ws://10.0.2.2:8787
# A PRE-MINTED token for a real endpoint, empty by default. Never put the production HS256 SECRET in
# an APK: a leaked token is a revocable kick (§10), a leaked secret is a rotation of every token ever
# issued.
rtdbToken=

# §5.7: the app fetches its own tokens from here (the console auth-server's POST /shadow-token).
# The KEY it presents is not here and never is — it lives in local.properties, which is gitignored.
shadowTokenUrl=https://console.example.com/shadow-token
